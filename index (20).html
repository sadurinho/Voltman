// ─── EVENTS ────────────────────────────────────────────────────────────────────
function attachEvents() {
  // Tab navigation
  document.querySelectorAll("[data-tab]").forEach(el => {
    el.onclick = () => { state.tab = el.dataset.tab; state.showClients = false; state.setPage = null; render(); };
  });
  // v86: menu ustawień — wejście w podstronę i powrót
  document.querySelectorAll("[data-setpage]").forEach(el => {
    el.onclick = () => { state.setPage = el.dataset.setpage || null; window.scrollTo(0,0); render(); };
  });
  // v83: nagłówki sekcji zwijanych
  document.querySelectorAll("[data-sec]").forEach(el => {
    el.onclick = () => {
      if (!state.secOpen) state.secOpen = {};
      state.secOpen[el.dataset.sec] = !state.secOpen[el.dataset.sec];
      render();
    };
  });
  // Jobs filter
  document.querySelectorAll("[data-jfilter]").forEach(el => {
    el.onclick = () => { state.jobsFilter = el.dataset.jfilter; state.jobsShow = 25; render(); };
  });
  // FIX v82: szukanie — z opóźnieniem, żeby nie przerysowywać przy każdej literze, i z powrotem kursora
  document.querySelectorAll("[data-jsearch]").forEach(el => {
    el.oninput = () => {
      state.jobsSearch = el.value; state.jobsShow = 25;
      clearTimeout(window._jsTimer);
      window._jsTimer = setTimeout(() => {
        render();
        const n = document.querySelector("[data-jsearch]");
        if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
      }, 250);
    };
  });
  // Job selection for combining
  document.querySelectorAll("[data-jsel]").forEach(el => {
    el.onchange = () => {
      const id = el.dataset.jsel;
      if (!state.selectedJobs) state.selectedJobs = [];
      if (el.checked) { if (!state.selectedJobs.includes(id)) state.selectedJobs.push(id); }
      else { state.selectedJobs = state.selectedJobs.filter(x => x !== id); }
      render();
    };
  });
  // Jobs grouping toggle
  document.querySelectorAll("[data-jgroup]").forEach(el => {
    el.onclick = () => { state.jobsGroup = el.dataset.jgroup === "1"; render(); };
  });
  // Duplicate quote
  document.querySelectorAll("[data-dup-quote]").forEach(el => {
    el.onclick = () => duplicateQuote(el.dataset.dupQuote);
  });
  // Inline payment stage toggle in Jobs list
  document.querySelectorAll("[data-jpaid]").forEach(el => {
    el.onclick = () => {
      const [id, idxStr] = el.dataset.jpaid.split("|");
      const idx = Number(idxStr);
      const list = loadQuotes();
      const job = list.find(q => q.id === id);
      if (job) {
        if (!job.paidStages) job.paidStages = [];
        if (job.paidStages.includes(idx)) job.paidStages = job.paidStages.filter(x => x !== idx);
        else job.paidStages.push(idx);
        persistQuotes(list);
        if (state.currentQuoteId === id) state.paidStages = [...job.paidStages];
      }
      render();
    };
  });
  // Inline job status change in Jobs list (updates saved record directly)
  document.querySelectorAll("[data-jstatus]").forEach(el => {
    el.onclick = () => {
      const [id, status] = el.dataset.jstatus.split("|");
      const list = loadQuotes();
      const job = list.find(q => q.id === id);
      if (job) {
        job.jobStatus = status;
        if (status === "paid") { const n = jobStageCount(job); job.paidStages = Array.from({length: n}, (_, i) => i); }   // FIX v80
        job.updatedAt = Date.now();
        persistQuotes(list);
      }
      if (state.currentQuoteId === id) state.jobStatus = status;
      render();
    };
  });
  // Saved quotes: open / delete
  document.querySelectorAll("[data-open-quote]").forEach(el => {
    el.onclick = () => loadQuoteById(el.dataset.openQuote);
  });
  document.querySelectorAll("[data-del-quote]").forEach(el => {
    el.onclick = () => { if (confirm("Delete this saved quote?")) deleteQuote(el.dataset.delQuote); };
  });

  // Restore backup
  const restoreEl = document.getElementById("restoreFile");
  if (restoreEl) {
    restoreEl.onchange = (e) => { if (e.target.files[0]) importBackup(e.target.files[0]); };
  }

  // Client book: load / delete
  document.querySelectorAll("[data-load-client]").forEach(el => {
    el.onclick = () => applyClient(el.dataset.loadClient);
  });
  document.querySelectorAll("[data-del-client]").forEach(el => {
    el.onclick = () => { if (confirm("Delete this saved client?")) deleteClient(el.dataset.delClient); };
  });

  // Payment stage paid toggles
  document.querySelectorAll("[data-stage-paid]").forEach(el => {
    el.onchange = () => {
      const i = Number(el.dataset.stagePaid);
      if (!state.paidStages) state.paidStages = [];
      if (el.checked) { if (!state.paidStages.includes(i)) state.paidStages.push(i); }
      else { state.paidStages = state.paidStages.filter(x => x !== i); }
      render();
    };
  });

  // Job status
  document.querySelectorAll("[data-status]").forEach(el => {
    el.onclick = () => {
      const s = el.dataset.status;
      if (s === "paid") {
        // remember the manual ticks so switching back doesn't lose them
        if (state.jobStatus !== "paid") state._stagesBeforePaid = [...(state.paidStages||[])];
        state.paidStages = calc().stages.map((_, i) => i);
      } else if (state.jobStatus === "paid") {
        state.paidStages = state._stagesBeforePaid ? [...state._stagesBeforePaid] : [];
        delete state._stagesBeforePaid;
      }
      state.jobStatus = s; render();
    };
  });
  // Hours
  document.querySelectorAll("[data-hr-date]").forEach(el => {
    el.onchange = () => { updateHours(el.dataset.hrDate, "date", el.value); };
  });
  document.querySelectorAll("[data-hr-hours]").forEach(el => {
    el.onfocus = () => el.select();
    el.oninput = () => updateHours(el.dataset.hrHours, "hours", el.value === "" ? "" : Number(el.value));
    el.onblur = () => { updateHours(el.dataset.hrHours, "hours", Number(el.value) || 0); render(); };
  });
  document.querySelectorAll("[data-hr-note]").forEach(el => {
    el.oninput = () => updateHours(el.dataset.hrNote, "note", el.value);
  });
  document.querySelectorAll("[data-hr-del]").forEach(el => {
    el.onclick = () => removeHours(el.dataset.hrDel);
  });

  // Costs
  document.querySelectorAll("[data-add-cost]").forEach(el => {
    el.onclick = () => addCost(el.dataset.addCost);
  });
  document.querySelectorAll("[data-cost-label]").forEach(el => {
    el.oninput = () => updateCost(el.dataset.costLabel, "label", el.value);
  });
  document.querySelectorAll("[data-cost-amount]").forEach(el => {

      if (!(Number(row.qty) > 0)) row.qty = 1;   // v88: pick a type = you want one; add more yourself
      render();
    };
  });
  document.querySelectorAll("[data-arow-custom]").forEach(el => {
    el.oninput = () => { state.addRows.find(r => r.id === el.dataset.arowCustom).customLabel = el.value; };
  });
  document.querySelectorAll("[data-arow-qty]").forEach(el => {
    el.onfocus = () => el.select();
    el.oninput = () => { state.addRows.find(r => r.id === el.dataset.arowQty).qty = el.value === "" ? "" : Number(el.value); };
    el.onblur = () => { const r = state.addRows.find(r => r.id === el.dataset.arowQty); r.qty = Number(el.value) || 0; render(); };
  });
  document.querySelectorAll("[data-arow-rate]").forEach(el => {
    el.onfocus = () => el.select();
    el.oninput = () => { state.addRows.find(r => r.id === el.dataset.arowRate).rate = el.value === "" ? "" : Number(el.value); };
    el.onblur = () => { const r = state.addRows.find(r => r.id === el.dataset.arowRate); r.rate = Number(el.value) || 0; render(); };
  });
  document.querySelectorAll("[data-arow-note]").forEach(el => {
    el.oninput = () => { state.addRows.find(r => r.id === el.dataset.arowNote).note = el.value; };
  });
  document.querySelectorAll("[data-arow-config]").forEach(el => {
    el.onchange = () => { const r = state.addRows.find(r => r.id === el.dataset.arowConfig); if (r) r.config = el.value; };
  });
  document.querySelectorAll("[data-arow-spur]").forEach(el => {
    el.onchange = () => { const r = state.addRows.find(r => r.id === el.dataset.arowSpur); if (r) { r.spur = el.value; r.rate = pointRate(r.typeId, r.spur); render(); } };
  });
  document.querySelectorAll("[data-arow-del]").forEach(el => {
    el.onclick = () => { state.addRows = state.addRows.filter(r => r.id !== el.dataset.arowDel); render(); };
  });
  document.querySelectorAll("[data-add-awork]").forEach(el => {
    el.onclick = () => {
      const tid = el.dataset.addAwork;
      if (!state.addRows) state.addRows = [];
      (() => { const nt = state.pointTypes.find(x => x.id === tid); const sp = nt && nt.spur ? "with" : undefined; const cf = nt && nt.configs ? nt.configs[0] : undefined; state.addRows.push({ id: uid(), typeId: tid, qty: 1, rate: pointRate(tid, sp), note: "", customLabel: "", spur: sp, config: cf }); })();
      render();
    };
  });

  // Extras
  document.querySelectorAll("[data-ex-label]").forEach(el => {
    el.oninput = () => { state.extras.find(e => e.id === el.dataset.exLabel).label = el.value; };
  });
  document.querySelectorAll("[data-ex-qty]").forEach(el => {
    el.onfocus = () => el.select();
    el.oninput = () => { state.extras.find(e => e.id === el.dataset.exQty).qty = el.value === "" ? "" : Number(el.value); updateSummary(); };
    el.onblur = () => { const x = state.extras.find(e => e.id === el.dataset.exQty); x.qty = Number(el.value) || 1; render(); };
  });
  document.querySelectorAll("[data-ex-price]").forEach(el => {
    el.onfocus = () => el.select();
    el.oninput = () => { state.extras.find(e => e.id === el.dataset.exPrice).price = el.value === "" ? "" : Number(el.value); updateSummary(); };
    el.onblur = () => { const x = state.extras.find(e => e.id === el.dataset.exPrice); x.price = Number(el.value) || 0; render(); };
  });
  document.querySelectorAll("[data-ex-del]").forEach(el => {
    el.onclick = () => { state.extras = state.extras.filter(e => e.id !== el.dataset.exDel); render(); };
  });
  document.querySelectorAll("[data-add-extra]").forEach(el => {
    el.onclick = () => {
      const v = el.dataset.addExtra;
      if (v === "custom") {
        state.extras.push({ id: uid(), label: "", price: 0, qty: 1 });
      } else {
        const p = EXTRA_PRESETS[Number(v)];
        state.extras.push({ id: uid(), label: p.label, price: p.price, qty: 1 });
      }
      render();
    };
  });
}

// Light-touch summary update without full re-render (keeps focus in inputs)
function updateSummary() {
  // Full render would lose focus; summary updates on blur instead. No-op during typing.
}

render();
requestPersistence();
migrateAttachments();
initOffline();
// Drive sync: pull on start (after the GIS script has had a moment to load), and when the tab comes back
if (syncCfg().enabled) { setTimeout(() => syncNow(false), 1200); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && syncCfg().enabled) syncNow(false); });
window.addEventListener("online", () => { if (syncCfg().enabled) syncNow(false); });
</script>
</body>
</html>
